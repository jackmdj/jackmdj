<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200" role="img" aria-label="Jack McColm, data scientist, live systems">
  <defs>
    <radialGradient id="glow" cx="0.22" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#f0f4f8" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .name {
      font: 700 64px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
      letter-spacing: -0.02em; fill: #14181d;
    }
    .sub {
      font: 400 17px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
      fill: #57606a;
    }
    .dot { fill: #1a7f37; }
    .ripple {
      fill: none; stroke: #1a7f37; stroke-width: 2;
      animation: ripple 2.6s cubic-bezier(0.2, 0.6, 0.4, 1) infinite;
    }
    @keyframes ripple {
      0%   { r: 8px;  opacity: 0.5; }
      70%  { r: 20px; opacity: 0; }
      100% { r: 20px; opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ripple { animation: none; opacity: 0; }
    }
  </style>
  <rect width="880" height="200" fill="#ffffff"/>
  <rect width="880" height="200" fill="url(#glow)"/>

  <text class="name" x="40" y="106">Jack McColm</text>
  <circle class="dot" cx="466" cy="84" r="8"/>
  <circle class="ripple" cx="466" cy="84" r="8"/>

  <text class="sub" x="43" y="148">Data scientist. I build autonomous systems and keep them alive in production.</text>
</svg>
