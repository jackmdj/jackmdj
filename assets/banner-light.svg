<svg xmlns="http://www.w3.org/2000/svg" width="880" height="190" viewBox="0 0 880 190" role="img" aria-label="Jack McColm, data scientist, UC Santa Barbara">
  <style>
    .eyebrow {
      font: 500 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: 0.32em; fill: #6e7781;
    }
    .name {
      font: 400 50px 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
      fill: #1f2328;
    }
    .trace {
      fill: none; stroke: #a06a24; stroke-width: 1.5;
      stroke-linejoin: round; stroke-linecap: round;
      stroke-dasharray: 1100; stroke-dashoffset: 1100;
      animation: draw 2.4s cubic-bezier(0.4, 0, 0.2, 1) 0.5s forwards;
    }
    .enddot {
      fill: #a06a24; opacity: 0;
      animation: appear 0.5s 2.7s forwards, breathe 3.2s 3.2s ease-in-out infinite;
    }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes appear { to { opacity: 1; } }
    @keyframes breathe { 50% { opacity: 0.3; } }
    @media (prefers-reduced-motion: reduce) {
      .trace { animation: none; stroke-dashoffset: 0; }
      .enddot { animation: none; opacity: 1; }
    }
  </style>
  <rect width="880" height="190" fill="#ffffff"/>

  <text class="eyebrow" x="42" y="52">DATA SCIENTIST · UC SANTA BARBARA</text>
  <text class="name" x="40" y="108">Jack McColm</text>

  <path class="trace" d="M0,152 H120 L132,140 L144,158 L158,134 L170,152 L182,146 L196,152 H310 L322,156 L332,124 L342,168 L352,148 L360,152 H480 C500,152 506,136 526,136 C546,136 550,152 570,152 C590,152 594,168 614,168 C634,168 638,152 658,152 H848"/>
  <circle class="enddot" cx="858" cy="152" r="3.5"/>
</svg>
