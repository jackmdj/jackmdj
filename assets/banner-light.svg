<svg xmlns="http://www.w3.org/2000/svg" width="880" height="130" viewBox="0 0 880 130" role="img" aria-label="Jack McColm">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#44515f"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0969da" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#0969da" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#0969da" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .name {
      font: 600 56px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
      letter-spacing: -0.03em;
      fill: url(#ink);
    }
    .beam {
      animation: sweep 7s cubic-bezier(0.45, 0, 0.25, 1) 1s infinite;
      transform: translateX(-160px);
    }
    @keyframes sweep {
      0%   { transform: translateX(-160px); }
      55%  { transform: translateX(880px); }
      100% { transform: translateX(880px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .beam { animation: none; opacity: 0; }
    }
  </style>
  <rect width="880" height="130" fill="#ffffff"/>

  <text class="name" x="40" y="72">Jack McColm</text>

  <rect x="0" y="102" width="880" height="1" fill="#d8dee4"/>
  <rect class="beam" x="0" y="101.5" width="160" height="2" fill="url(#beam)"/>
</svg>
