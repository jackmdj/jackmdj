<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200" role="img" aria-label="Jack McColm — data scientist">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#7ee787"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.15" cy="0" r="1">
      <stop offset="0" stop-color="#1f6feb" stop-opacity="0.14"/>
      <stop offset="0.6" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .name { font: 700 46px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: url(#accent); }
    .sub { font: 400 17px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8b949e; }
    .chip { fill: #161b22; stroke: #30363d; }
    .chiptext { font: 500 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #c9d1d9; }
    .dot { fill: #3fb950; animation: pulse 2.4s ease-in-out infinite; }
    .dot2 { animation-delay: 1.2s; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  </style>
  <rect width="880" height="200" rx="12" fill="#0d1117"/>
  <rect width="880" height="200" rx="12" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="878.5" height="198.5" rx="11.25" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <text class="name" x="40" y="82">Jack McColm</text>
  <text class="sub" x="42" y="116">Data scientist · AI agents, data pipelines, and autonomous systems</text>

  <rect class="chip" x="40" y="140" width="212" height="30" rx="15"/>
  <circle class="dot" cx="58" cy="155" r="4"/>
  <text class="chiptext" x="70" y="160">blingbot · trading live</text>

  <rect class="chip" x="264" y="140" width="232" height="30" rx="15"/>
  <circle class="dot dot2" cx="282" cy="155" r="4"/>
  <text class="chiptext" x="294" y="160">healthybot · coaching daily</text>
</svg>
